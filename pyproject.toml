[project]
name = "deepswe-rank-stability"
version = "0.1.0"
description = "Exploratory DeepSWE benchmark rank-stability analysis."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dashboard = [
    "datashader>=0.16",
    "holoviews>=1.19",
    "hvplot>=0.11",
    "panel>=1.5",
    "perspective-python>=3.0",
    "plotly>=5.24",
    "vizro>=0.1.34",
]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
